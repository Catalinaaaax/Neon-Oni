<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="navbar">
    <div class="branding">
      <img src="IMG/LOGO NEON ONI.png" alt="Logo Neón Oni" />
      <span class="titulo-japones">ネオン鬼</span>
    </div>
    <nav>
      <div class="carrito-icono-container">
        <img src="IMG/CARRITO BLANCO.png" alt="Carrito" id="icono-carrito" />
        <span id="contador-carrito">0</span>
      </div>
      <a href="index.html">Inicio</a>
      <a href="productos.html" class="active">Productos</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="faq.html">FAQ</a>
      <a href="https://wa.me/573151774787?text=Hola,%20vengo%20de%20la%20página%20web%20y%20me%20gustaría%20obtener%20más%20información." target="_blank" class="btn">Contáctanos</a>
    </nav>
  </header>

  <main>
    <div class="productos-header">
      <h1>Productos</h1>
      <p>Explora nuestra colección por categoría.</p>
    </div>

    <!-- Segmentos de primer nivel -->
    <div class="segmentos-container" style="display:flex; justify-content:center; gap:.5rem; margin:0 auto 1rem; flex-wrap:wrap;">
      <button id="segmento-anime" onclick="setSegmento('anime')" class="cta filtro-activo">Anime</button>
      <button id="segmento-neon-oni" onclick="setSegmento('neon-oni')" class="cta">Estilo Japonés</button>
    </div>

    <!-- Controles de filtro y búsqueda -->
    <div class="filtros-container">
      <!-- Barra de búsqueda -->
      <div class="search-bar-container">
        <input type="text" id="search-input" placeholder="Buscar por nombre (ej: Zoro, Nezuko...)" oninput="buscarProductos()">
      </div>

      <!-- Botones de filtro -->
      <button id="btn-camisetas" onclick="filtrarProductos('camisetas')" class="cta">Camisetas</button>
      <button id="btn-hoodies" onclick="filtrarProductos('hoodies')" class="cta">Hoodies</button>
      <button id="btn-accesorios" onclick="filtrarProductos('accesorios')" class="cta">Accesorios</button>
      <button id="btn-todos" onclick="filtrarProductos('')" class="cta">Todos</button>
    </div>

    <!-- Contenedor de productos -->
    <div class="product-grid" id="productos-container"></div>
  
  </main>

  <!-- Banner de Cookies -->
  <div id="cookie-banner">
    <p>Utilizamos cookies para mejorar tu experiencia. Al continuar, aceptas nuestro uso de cookies.</p>
    <div class="cookie-buttons">
      <button id="cookie-accept" class="cta">Aceptar</button>
      <button id="cookie-decline" class="cta cta-secondary">Rechazar</button>
    </div>
  </div>

  <footer>
    <p>© 2025 Neon Oni. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="productos.js"></script>
  <!-- El script para la animación de scroll se ha movido a productos.js -->
  
</body>
</html>
